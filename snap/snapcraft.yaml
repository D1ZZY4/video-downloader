# Build by running `snapcraft pack`.

name: video-downloader
license: GPL-3.0+
grade: stable
adopt-info: video-downloader

base: core24
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  video-downloader:
    command: usr/bin/video-downloader
    extensions:
      - gnome
    plugs:
      - home
      - network
    common-id: com.github.unrud.VideoDownloader
    desktop: usr/share/applications/com.github.unrud.VideoDownloader.desktop

slots:
  video-downloader:
    interface: dbus
    bus: session
    name: com.github.unrud.VideoDownloader

parts:
  video-downloader:
    plugin: nil
    source: .
    source-type: git
    build-packages:
      - cargo
      - rustc
      - libgtk-4-dev
      - libadwaita-1-dev
      - libglib2.0-dev
      - gettext
    stage-packages:
      - xdg-user-dirs
      - ffmpeg
    override-build: |
      craftctl default
      cargo build --release
      install -Dm755 target/release/video-downloader "${CRAFT_PART_INSTALL}/usr/bin/video-downloader"
      install -Dm644 data/com.github.unrud.VideoDownloader.desktop.in "${CRAFT_PART_INSTALL}/usr/share/applications/com.github.unrud.VideoDownloader.desktop"
      install -Dm644 data/com.github.unrud.VideoDownloader.svg "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/scalable/apps/com.github.unrud.VideoDownloader.svg"
      install -Dm644 data/com.github.unrud.VideoDownloader-symbolic.svg "${CRAFT_PART_INSTALL}/usr/share/icons/hicolor/symbolic/apps/com.github.unrud.VideoDownloader-symbolic.svg"
      install -Dm644 data/com.github.unrud.VideoDownloader.gschema.xml "${CRAFT_PART_INSTALL}/usr/share/glib-2.0/schemas/com.github.unrud.VideoDownloader.gschema.xml"
      glib-compile-schemas "${CRAFT_PART_INSTALL}/usr/share/glib-2.0/schemas"
    parse-info: [usr/share/metainfo/com.github.unrud.VideoDownloader.metainfo.xml]
